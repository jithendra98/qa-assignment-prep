# Dream Portal QA Automation - Configuration
base.url=https://arjitnigam.github.io/myDreams/
browser=chrome
headless=false
implicit.wait=10
explicit.wait=15
page.load.timeout=30
screenshot.on.failure=true
screenshot.dir=screenshots/

# AI Configuration (Optional - for bonus AI-based validation)
# Set your OpenAI API key here or as environment variable OPENAI_API_KEY
openai.api.key=${OPENAI_API_KEY}
openai.model=gpt-3.5-turbo
ai.enabled=true
